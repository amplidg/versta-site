# Publica o site oficial (https://versta.com.br) na Hostinger a cada push na
# branch main: monta o site para o domínio, junta o .htaccess (hostinger/) e
# envia por FTP criptografado só o que mudou para a public_html.
# Segredos no GitHub: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (14/11/2026).
name: Publicar em versta.com.br (Hostinger)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build estático para versta.com.br
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://versta.com.br
          NEXT_TELEMETRY_DISABLED: 1

      - name: Configuração do servidor (.htaccess)
        run: cp hostinger/.htaccess out/.htaccess

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # FTPS com lftp: o servidor da Hostinger exige reaproveitar a sessão TLS
      # na conexão de dados, o que o lftp faz (a FTP-Deploy-Action dava erro 425).
      # Envia tudo e apaga do servidor o que não existe mais no site (página
      # removida, arquivos antigos de _next/), menos .well-known e .ftpquota.
      - name: Enviar para a Hostinger
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$U" --env-password "$H" <<'FIM'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit true
          mirror -R --parallel=6 --delete --exclude-glob .well-known/ --exclude-glob .ftpquota ./out/ domains/versta.com.br/public_html/
          bye
          FIM
