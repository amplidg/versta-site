# Desde 14/11/2026 o site oficial está em https://versta.com.br (Hostinger).
# O GitHub Pages (amplidg.github.io/versta-site) só redireciona cada página
# para o mesmo endereço no domínio novo (scripts/redirect-site.mjs).
# Para voltar a publicar o site completo aqui, restaure os passos de build
# do commit anterior a esta mudança.
name: Redirecionar GitHub Pages para versta.com.br

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Páginas de redirecionamento
        run: node scripts/redirect-site.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
