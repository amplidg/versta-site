<style>
:root{
  --navy:#00294D; --caramel:#B46D49; --peach:#FCDAC4; --cream:#F7F5EF; --text:#33475B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:Calibri,Carlito,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  color:var(--navy);
  background:linear-gradient(180deg,#F9C7AC 0%,#FBD7BF 28%,#EDE0CD 50%,#DFE5D7 66%,#CDE4DD 82%,#ACD3DC 100%) fixed;
  min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;
}
main{
  width:100%;max-width:480px;
  padding:56px max(20px,env(safe-area-inset-left)) 40px max(20px,env(safe-area-inset-right));
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;
}
.logo{width:min(78%,300px);height:auto;display:block}
h1{
  font-family:"STIX Two Text",Georgia,"Times New Roman",serif;
  font-weight:700;font-size:clamp(24px,6.4vw,30px);line-height:1.22;color:var(--navy);
  text-wrap:balance;max-width:24ch
}
.rule{width:56px;height:3px;border-radius:2px;background:var(--caramel)}
.links{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:4px}
.btn{
  display:flex;align-items:center;gap:16px;width:100%;
  padding:16px 20px;border-radius:18px;text-decoration:none;
  font-size:19px;font-weight:700;letter-spacing:.01em;text-align:left;
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn .ic{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.btn .ic svg{width:22px;height:22px}
.btn .lbl{flex:1;display:flex;flex-direction:column;gap:2px}
.btn .lbl small{font-size:15px;font-weight:400;opacity:.8;letter-spacing:0}
.btn .arrow{flex:none;opacity:.6}
.primary{background:var(--navy);color:var(--cream);box-shadow:0 10px 24px rgba(0,41,77,.22)}
.primary .ic{background:rgba(252,218,196,.16)}
.secondary{background:rgba(255,253,248,.92);color:var(--navy);box-shadow:0 6px 18px rgba(0,41,77,.10);border:1px solid rgba(0,41,77,.08)}
.secondary .ic{background:#D6E9DF}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.99)}
.btn:focus-visible{outline:3px solid var(--caramel);outline-offset:3px}
footer{margin-top:auto;padding-top:24px;font-size:14px;color:var(--text);opacity:.85;letter-spacing:.14em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>
</head>
